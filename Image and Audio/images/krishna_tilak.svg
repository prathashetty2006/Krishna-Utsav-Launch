<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="tilakYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEA79"/>
      <stop offset="60%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="tilakWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="tilakShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3E2405" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#tilakShadow)" transform="translate(10, 5) scale(0.8)">
    <!-- Outer Sacred U-shape (Chandan) -->
    <path d="M 28,15 L 34,15 L 34,68 C 34,78 42,86 50,86 C 58,86 66,78 66,68 L 66,15 L 72,15 L 72,68 C 72,82 62,92 50,92 C 38,92 28,82 28,68 Z" fill="#3E2405"/>
    <path d="M 30,17 L 34,17 L 34,68 C 34,77 41,84 50,84 C 59,84 66,77 66,68 L 66,17 L 70,17 L 70,68 C 70,80 61,90 50,90 C 39,90 30,80 30,68 Z" fill="url(#tilakWhite)"/>

    <!-- Central Saffron / Kumkum Line -->
    <path d="M 47,20 L 53,20 L 53,74 C 53,77 51,80 50,80 C 49,80 47,77 47,74 Z" fill="url(#tilakYellow)"/>
    
    <!-- Base Tulsi Leaf Symbol at bottom of Urdhva Pundra -->
    <path d="M 50,88 C 45,94 42,100 50,105 C 58,100 55,94 50,88 Z" fill="#3E2405"/>
    <path d="M 50,90 C 46,95 44,99 50,103 C 56,99 54,95 50,90 Z" fill="url(#tilakYellow)"/>
  </g>
</svg>
